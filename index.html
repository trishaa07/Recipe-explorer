<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <script>
    tailwind.config={
      theme:{
        extend:{
          colors:{
            mint:{
              50: "#F4FBF8",
              100: "#E8F6F0",
              200: "#D6EFE6",
              300: "#BFE4D6",
              500: "#2F7D6B",
              600: "#236756",
              700: "#1D5548"
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="min-h-screen bg-white text-slate-800">
  <header class="bg-mint-100 border-b border-mint-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 py-4 flex items-center justify-between gap-6">
      <a href="index.html" class="flex items-center gap-3 font-bold text-lg text-slate-800">
        <span class="text-2xl" aria-hidden="true"><i class="fa-solid fa-utensils"></i></span>
        <span>Recipe Explorer</span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-medium ">
        <a href="index.html" class="nav-link nav-active">Home</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-5 sm:px-8 py-10">
    <section class="text-center max-w-3xl mx-auto mb-8">
      <h1 class="text-4xl sm:text-5xl font-bold tracking-tight">Recipe Explorer</h1>
      <p class="mt-3 text-slate-500">
        Discover and explore delicious recipes from around the world.
      </p>
    </section>
    <section class="mb-5">
      <div class="flex flex-col lg:flex-row gap-3">
        <label class="relative flex-1">
          <span class="sr-only">Search recipes</span>
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input
            id="searchInput"
            type="search"
            placeholder="Search recipes..."
            class="control w-full pl-11 pr-4"
          />
        </label>
        <label class="lg:w-64">
          <span class="sr-only">Sort recipes</span>
          <select id="sortSelect" class="control w-full">
            <option value="time-asc">Sort by: Total Time ↑</option>
            <option value="time-desc">Sort by: Total Time ↓</option>
            <option value="rating-desc">Sort by: Rating ↓</option>
            <option value="calories-asc">Sort by: Calories ↑</option>
          </select>
        </label>
      </div>
    </section>                                                                               
    <section class="mb-4">
      <div id="mealChips" class="flex flex-wrap gap-2">
      </div>
    </section>
    <section class="mb-8 flex flex-col sm:flex-row gap-3">
      <label class="sm:w-64">
        <span class="sr-only">Cuisine filter</span>
        <select id="cuisineSelect" class="control w-full">
          <option value="All">Cuisine: All</option>
        </select>
      </label>
      <label class="sm:w-64">
        <span class="sr-only">Difficulty filter</span>
        <select id="difficultySelect" class="control w-full">
          <option value="All">Difficulty: All</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </label>
      <button id="clearFilters" class="secondary-button" type="button">
        Clear filters
      </button>
    </section>
    <div id="status" class="mb-5 text-sm text-slate-500" >
      Loading recipes...
    </div>
      <section
      id="recipeGrid"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"
      aria-live="polite"
    ></section>
    <section id="emptyState" class="hidden py-16 text-center">
      <div class="text-4xl mb-3"><i class="fa-solid fa-utensils"></i></div>
      <h2 class="text-xl font-semibold">No recipes found</h2>
      <p class="mt-2 text-slate-500">Try changing your search or filters.</p>
    </section>
  </main>
   <div
    id="recipeModal"
    class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle">
    <div
      class="modal-panel w-full max-w-5xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white"
      id="modalPanel">
      <div class="grid md:grid-cols-2">
        <div class="min-h-64 md:min-h-full">
          <img
            id="modalImage"
            src=""
            alt=""
            class="w-full h-72 md:h-full object-cover"/>
        </div>
        <div class="p-6 sm:p-8">
          <div class="flex justify-between items-start gap-4">
            <div>
              <div id="modalBadges" class="flex flex-wrap gap-2 mb-3"></div>
              <h2 id="modalTitle" class="text-2xl sm:text-3xl font-bold"></h2>
            </div>
            <button
              id="closeModal"
              class="close-button"
              type="button"
              aria-label="Close recipe details">
              ×</button>
          </div>+
          <div id="modalMeta" class="flex flex-wrap gap-4 mt-5 text-sm text-slate-500"></div>
          <div class="mt-7">
            <h3 class="section-heading">Ingredients</h3>
            <ul id="modalIngredients" class="mt-3 space-y-2 list-disc pl-5 text-slate-600"></ul>
          </div>
          <div class="mt-7">
            <h3 class="section-heading">Instructions</h3>
            <ol id="modalInstructions" class="mt-3 space-y-3"></ol>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js?v=4"></script>
</body>
</html>
